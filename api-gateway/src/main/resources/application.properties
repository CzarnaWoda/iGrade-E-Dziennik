eureka.client.serviceUrl.defaultZone = http://localhost:8761/eureka
debug=true
spring.application.name=api-gateway

#RSA KEYS
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem


logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator = INFO
logging.level.org.springframework.cloud.gateway = TRACE

#User service route
spring.cloud.gateway.mvc.routes[0].id = user-service
spring.cloud.gateway.mvc.routes[0].uri = lb://user-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/user/**,/api/v1/authentication/**


#Student Teacher Data Service
spring.cloud.gateway.mvc.routes[1].id = teacherStudentData-service
spring.cloud.gateway.mvc.routes[1].uri = lb://teacherStudentData-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/grade/**,/api/v1/note/**,/api/v1/class/**,/api/v1/subject/**

#Notification Service
spring.cloud.gateway.mvc.routes[2].id = notification-service
spring.cloud.gateway.mvc.routes[2].uri = lb://notification-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/notification/**

#Discovery Server Route
spring.cloud.gateway.mvc.routes[3].id = discovery-server
spring.cloud.gateway.mvc.routes[3].uri = http://localhost:8761
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.mvc.routes[3].filters[0]=SetPath=/

#Discover Server Static Resources Route
spring.cloud.gateway.mvc.routes[4].id = discovery-server-static
spring.cloud.gateway.mvc.routes[4].uri = http://localhost:8761
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/eureka/**




