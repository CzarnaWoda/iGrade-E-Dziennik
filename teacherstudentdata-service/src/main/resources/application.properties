#Main spring configuration
spring.application.name=teacherStudentData-service
server.port=0



#DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
#url to database
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#login and password
spring.datasource.username=postgres
spring.datasource.password=admin


#Other database configuration
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect




#DEBUG
debug=false

#EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka


#Circuit breaker
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#GRADE - CIRCUIT BREAKER

#Resilince 4j properties
resilience4j.circuitbreaker.instances.grade.register-health-indicator=true
resilience4j.circuitbreaker.instances.grade.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.grade.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.grade.sliding-window-size=5
resilience4j.circuitbreaker.instances.grade.failure-rate-threshold=30
resilience4j.circuitbreaker.instances.grade.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.grade.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.grade.automatic-transition-from-open-to-half-open-enabled=true

#Resilience4J Timeout properties
#resilience4j.timelimiter.instances.grade.timeout-duration=3s

#NOTES - CIRCUIT BREAKER

#Resilince 4j properties
resilience4j.circuitbreaker.instances.note.register-health-indicator=true
resilience4j.circuitbreaker.instances.note.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.note.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.note.sliding-window-size=5
resilience4j.circuitbreaker.instances.note.failure-rate-threshold=30
resilience4j.circuitbreaker.instances.note.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.note.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.note.automatic-transition-from-open-to-half-open-enabled=true

#Resilience4J Timeout properties
#resilience4j.timelimiter.instances.note.timeout-duration=3s

# Kafka Properties

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=gradeTopic
spring.kafka.consumer.group-id= notificationServiceId
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=notificationCreate:me.igrade.events.NotificationCreateEvent